apiVersion: apps/v1
kind: Deployment
metadata:
  name: legalmitra-cluster
  labels:
    app: legalmitra
spec:
  replicas: 3
  selector:
    matchLabels:
      app: legalmitra
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: legalmitra
    spec:
      containers:
      - name: legalmitra-api
        image: legalmitra/sovereign-core:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/v1/bhashini/status
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: legalmitra-service
spec:
  type: ClusterIP
  selector:
    app: legalmitra
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
