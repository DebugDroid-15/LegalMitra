[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legalmitra"
version = "0.1.0"
description = "Indian Legal Dataset Engineering Pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "LegalMitra AI Team"}
]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "docling>=2.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["legalmitra*", "config*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

